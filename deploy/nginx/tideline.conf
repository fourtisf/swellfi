# Nginx site for Tideline. Copy to /etc/nginx/sites-available/tideline, symlink into
# sites-enabled, replace tideline.example.com, then: certbot --nginx -d tideline.example.com

limit_req_zone $binary_remote_addr zone=tl_api:10m rate=20r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream tideline_web { server 127.0.0.1:3000; keepalive 32; }
upstream tideline_api { server 127.0.0.1:4000; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name tideline.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tideline.example.com;

    ssl_certificate     /etc/letsencrypt/live/tideline.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tideline.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # REST API
    location /api/ {
        limit_req zone=tl_api burst=40 nodelay;
        proxy_pass http://tideline_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket gateway (activity, chat, user notifications)
    location = /ws {
        proxy_pass http://tideline_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Next.js static assets: long cache
    location /_next/static/ {
        proxy_pass http://tideline_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js app
    location / {
        proxy_pass http://tideline_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
