# Nginx site for Swellfi (swellfi.xyz). Installed by deploy/bootstrap.sh, which first gets the
# Let's Encrypt certificate (webroot) and then puts this file in sites-available/swellfi.
# Plain HTTP goes to HTTPS on the same host, then www goes to https://swellfi.xyz (one origin for
# wallet sign-in). HSTS carries `preload`, ready for submission at https://hstspreload.org.

limit_req_zone $binary_remote_addr zone=tl_api:10m rate=20r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream swellfi_web { server 127.0.0.1:3000; keepalive 32; }
upstream swellfi_api { server 127.0.0.1:4000; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name swellfi.xyz www.swellfi.xyz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    # HSTS preload rule: HTTP must first redirect to HTTPS on the same host.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.swellfi.xyz;
    ssl_certificate     /etc/letsencrypt/live/swellfi.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swellfi.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    return 301 https://swellfi.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name swellfi.xyz;

    ssl_certificate     /etc/letsencrypt/live/swellfi.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swellfi.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:swellfi_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Next.js and the API (helmet) send these too; keep only the copy added here.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # REST API
    location /api/ {
        limit_req zone=tl_api burst=40 nodelay;
        proxy_pass http://swellfi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket gateway (activity, chat, user notifications)
    location = /ws {
        proxy_pass http://swellfi_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Next.js static assets (long cache, set by Next)
    location /_next/static/ {
        proxy_pass http://swellfi_web;
        # Next already sends "Cache-Control: public, max-age=31536000, immutable" here. No add_header
        # in this block, so it inherits the server's security headers.
    }

    # Next.js app
    location / {
        proxy_pass http://swellfi_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
